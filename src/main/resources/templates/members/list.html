<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Members · BookNest</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2f28'/%3E%3Cpath d='M16 18h13a5 5 0 0 1 3 1 5 5 0 0 1 3-1h13v30H35a4 4 0 0 0-3 1 4 4 0 0 0-3-1H16z' fill='%23e2bd78'/%3E%3C/svg%3E"><meta name="theme-color" content="#0f2f28"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body><div th:replace="~{fragments/layout :: topbar}"></div><div th:replace="~{fragments/layout :: alerts}"></div><main class="container-fluid px-lg-4 py-4"><div class="page-heading"><div><p class="eyebrow">People</p><h1>Members</h1><p class="muted">Keep member contact details in one place.</p></div><a class="btn btn-primary" th:href="@{/members/new}"><i class="bi bi-person-plus me-2"></i>Register member</a></div><section class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Member</th><th>Email</th><th>Phone</th><th>Member ID</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="member : ${members}"><td><div class="member-avatar" th:text="${#strings.substring(member.fullName,0,1).toUpperCase()}">M</div><span class="fw-semibold" th:text="${member.fullName}">Name</span></td><td th:text="${member.email}">Email</td><td th:text="${member.phone == null or member.phone.isBlank() ? '—' : member.phone}">Phone</td><td th:text="${'#' + member.id}">ID</td><td class="text-end"><form method="post" th:action="@{/members/{id}/delete(id=${member.id})}" onsubmit="return confirm('Delete this member?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash3 me-1"></i>Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(members)}"><td colspan="5" class="empty-state">No members registered yet.</td></tr></tbody></table></div></section></main><div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
