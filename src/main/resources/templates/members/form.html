<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register Member · BookNest</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2f28'/%3E%3Cpath d='M16 18h13a5 5 0 0 1 3 1 5 5 0 0 1 3-1h13v30H35a4 4 0 0 0-3 1 4 4 0 0 0-3-1H16z' fill='%23e2bd78'/%3E%3C/svg%3E"><meta name="theme-color" content="#0f2f28"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body><div th:replace="~{fragments/layout :: topbar}"></div><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4 form-container"><a class="back-link" th:href="@{/members}">← Back to members</a><div class="form-card mt-3"><p class="eyebrow">Member directory</p><h1>Register member</h1><p class="muted mb-4">Add a reader before issuing books to them.</p><form th:object="${member}" th:action="@{/members}" method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" th:field="*{fullName}" placeholder="Reader's full name" required><div class="field-error" th:errors="*{fullName}"></div></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" th:field="*{email}" placeholder="reader@example.com" required><div class="field-error" th:errors="*{email}"></div></div><div class="mb-4"><label class="form-label">Phone number <span class="muted">(optional)</span></label><input class="form-control" th:field="*{phone}" placeholder="Phone number"></div><button class="btn btn-primary" type="submit">Register member</button><a class="btn btn-outline-secondary ms-2" th:href="@{
