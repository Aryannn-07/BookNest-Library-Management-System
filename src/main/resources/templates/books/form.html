<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' · BookNest'">Book · BookNest</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2f28'/%3E%3Cpath d='M16 18h13a5 5 0 0 1 3 1 5 5 0 0 1 3-1h13v30H35a4 4 0 0 0-3 1 4 4 0 0 0-3-1H16z' fill='%23e2bd78'/%3E%3C/svg%3E"><meta name="theme-color" content="#0f2f28"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body><div th:replace="~{fragments/layout :: topbar}"></div><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4 form-container"><a class="back-link" th:href="@{/books}">← Back to books</a><div class="form-card mt-3"><p class="eyebrow">Collection details</p><h1 th:text="${pageTitle}">Add Book</h1><p class="muted mb-4">Enter accurate details so the catalogue stays searchable.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:object="${book}" th:action="${book.id == null ? '/books' : '/books/' + book.id}" method="post"><div class="mb-3"><label class="form-label">ISBN</label><input class="form-control" th:field="*{isbn}" placeholder="9780132350884" required><div class="field-error" th:errors="*{isbn}"></div></div><div class="mb-3"><label class="form-label">Book title</label><input class="form-control" th:field="*{title}" placeholder="Clean Code" required><div class="field-error" th:errors="*{title}"></div></div><div class="mb-3"><label class="form-label">Author</label><input class="form-control" th:field="*{author}" placeholder="Author name" required><div class="field-error" th:errors="*{author}"></div></div><div class="mb-3"><label class="form-label">Category</label><input class="form-control" th:field="*{category}" placeholder="Programming, Fiction, History..." required><div class="field-error" th:errors="*{category}"></div></div><div class="mb-3"><label class="form-label">Acquisition / purchase date</label><input class="form-control" type="date" name="acquisitionDate" th:value="${book.acquisitionDate != null ? book.acquisitionDate : defaultAcquisitionDate}"><div class="form-text">Used for recent-acquisition dashboard statistics.</div></div><div class="mb-4"><label class="form-label">Total copies</label><input class="form-control" type="number" min="1" th:field="*{totalCopies}" required><div class="field-error" th:errors="*{totalCopies}"></div><div class="form-text">When editing, copies already issued remain counted as unavailable.</div></div><button class="btn btn-primary" type="submit" th:text="${book.id == null ? 'Save book' : 'Update book'}">Save book</button><a class="btn btn-outline-secondary ms-2" th:href="@{/books}">Cancel</a></form></div></main><div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
