<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Books · BookNest</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2f28'/%3E%3Cpath d='M16 18h13a5 5 0 0 1 3 1 5 5 0 0 1 3-1h13v30H35a4 4 0 0 0-3 1 4 4 0 0 0-3-1H16z' fill='%23e2bd78'/%3E%3C/svg%3E"><meta name="theme-color" content="#0f2f28"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body><div th:replace="~{fragments/layout :: topbar}"></div><div th:replace="~{fragments/layout :: alerts}"></div><main class="container-fluid px-lg-4 py-4"><div class="page-heading"><div><p class="eyebrow"><i class="bi bi-bookshelf me-2"></i>Collection</p><h1>Books</h1><p class="muted">Manage titles, copies and availability.</p></div><a class="btn btn-primary" th:href="@{/books/new}"><i class="bi bi-plus-lg me-2"></i>Add book</a></div><section class="panel"><form class="search-row" method="get" th:action="@{/books}"><div class="search-box"><span><i class="bi bi-search"></i></span><input type="search" name="q" th:value="${q}" placeholder="Search title, author, ISBN or category..."></div><button class="btn btn-dark" type="submit"><i class="bi bi-search me-1"></i>Search</button><a class="btn btn-outline-secondary" th:href="@{/books}"><i class="bi bi-x-circle me-1"></i>Clear</a></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Book details</th><th>ISBN</th><th>Category</th><th>Copies</th><th>Availability</th><th>Acquired</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="book : ${books}"><td><div class="fw-semibold" th:text="${book.title}">Title</div><small class="muted" th:text="${book.author}">Author</small></td><td th:text="${book.isbn}">ISBN</td><td><span class="category-tag" th:text="${book.category}">Category</span></td><td th:text="${book.totalCopies}">0</td><td><span class="status-pill status-active" th:if="${book.availableCopies > 0}" th:text="${book.availableCopies + ' available'}">Available</span><span class="status-pill status-overdue" th:if="${book.availableCopies == 0}">Out of stock</span></td><td th:text="${book.acquisitionDate == null ? '—' : book.acquisitionDate}">Date</td><td class="text-end text-nowrap"><a th:if="${book.availableCopies == 0}" class="btn btn-sm btn-outline-success" th:href="@{/reservations/new}"><i class="bi bi-bookmark-plus me-1"></i>Reserve</a> <a class="btn btn-sm btn-outline-primary" th:href="@{/books/{id}/edit(id=${book.id})}"><i class="bi bi-pencil-square me-1"></i>Edit</a><form class="d-inline" method="post" th:action="@{/books/{id}/delete(id=${book.id})}" onsubmit="return confirm('Delete this book?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash3 me-1"></i>Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(books)}"><td colspan="7" class="empty-state">No books found. Try another search or add a book.</td></tr></tbody></table></div></section></main><div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
